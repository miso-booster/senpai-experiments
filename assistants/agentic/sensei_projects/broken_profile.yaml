test_name: "broken_profile_example"

llm:
  temperature: "high"
  model: "gpt-4o"
  model_prov: "openai"
  format:
    type: "text"

user:
  language: "English"
  role: "This user is confused and makes no sense."
  context:
    - personality: "non_existent_file.yml"
    - "User loves pineapple on pizza."
  goals:
    - "Order a {{size}} pizza with {{toppings}} and {{cans}} cans of {{drink}}"
    - size:
        function: "random()"
        type: "string"
        data: [small, medium, large]
    - toppings:
        function: "another()"
    - cans:
        function: "invalid_function()"
        type: "int"
        data: [1, 2, 3]

chatbot:
  is_starter: "yes"
  fallback: "Sorry, I didn't understand that."
  output:
    - price:
        description: "Final price for the order"
    - order_id:
        type: "string"
        description: "The order identifier"

conversation:
  number: "two"
  goal_style:
    steps: -5
  interaction_style:
    - random:
      - "long phrases"
      - "make spelling mistakes"
      - "unknown_style"
