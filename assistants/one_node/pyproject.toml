[project]
name = "senpai-assistant"
version = "0.1.0"
description = "Senapi, the assistant in the chatbot dojo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.27",
    "langchain-openai>=0.3.35",
    "langgraph>=0.6.10",
    "langgraph-checkpoint-sqlite>=2.0.11",
    "openai>=2.3.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20250915",
    "pydantic>=2.12.2",
    "numpy>=2.3.5",
    "langchain-community>=0.3.31",
    "sentence-transformers>=5.1.2",
]

[tool.mypy]
strict = true
exclude = ["venv", ".venv"]

[tool.ruff]
# default is too small
line-length = 120
target-version = "py312"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]


[tool.ruff.lint]
select = ["E", "F", "I", "B", "ANN", "D"]
ignore = [
    "E501", # line too long
    # "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", # Common missing docstring rules
    "E203", # whitespace before “:” (conflicts with some formatting choices)
    "COM812", # Creates incompatibility with formatter
    "T201", # Doesnt let you use prints
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]     # allow unused imports in __init__ for re-export
"tests/*.py" = ["ANN", "D"]  # less strict in test files

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-report=html"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
]
